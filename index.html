<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Audit Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117; color: #e2e4f0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .wrap { width: 480px; padding: 40px 20px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #7a80a0; margin-bottom: 32px; }
    .list { display: flex; flex-direction: column; gap: 12px; }
    a {
      display: flex; align-items: center; gap: 16px;
      background: #1a1d27; border: 1px solid #2e3348; border-radius: 12px;
      padding: 18px 20px; text-decoration: none; color: inherit;
      transition: border-color .15s;
    }
    a:hover { border-color: #6c7fff; }
    .icon { font-size: 22px; width: 32px; text-align: center; flex-shrink: 0; }
    .label { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .desc  { font-size: 12px; color: #7a80a0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>◈ Security Audit Demo</h1>
    <p class="sub">Next.js + Supabase セキュリティ診断 LT デモ</p>
    <div class="list">
      <a href="demo-app/slides.html">
        <div class="icon">📊</div>
        <div><div class="label">スライド</div><div class="desc">7分間LT用プレゼンテーション</div></div>
      </a>
      <a href="demo-app/index.html">
        <div class="icon">🖥</div>
        <div><div class="label">デモアプリ</div><div class="desc">診断対象の Next.js アプリ（診断前）</div></div>
      </a>
      <a href="demo-app/index.html?audited">
        <div class="icon">🔍</div>
        <div><div class="label">デモアプリ（診断結果表示）</div><div class="desc">Critical 8件のハイライト表示</div></div>
      </a>
      <a href="demo-app/attack.html">
        <div class="icon">⚡</div>
        <div><div class="label">攻撃シミュレーター</div><div class="desc">SB005 / NX002 / SB003 / GN001 の再現</div></div>
      </a>
    </div>
  </div>
</body>
</html>
